[project]
name = "apnigati"
version = "0.1.0"
description = "Apni Gati: every child learns at their own pace. Personalised homework and red-pen marking for multi-grade classrooms, built on Meta models"
authors = [
    { name = "Vilva Athiban P B", email = "vilvaathiban@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.32",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
